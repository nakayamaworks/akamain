name: Deploy あかマイン to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate and build
        run: npm run verify

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: typing-workbench-misemaru
          workload_identity_provider: projects/91251265328/locations/global/workloadIdentityPools/github-actions/providers/akamain
          service_account: akamain-hosting-deploy@typing-workbench-misemaru.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@15.26.0 deploy --only hosting --project typing-workbench-misemaru --non-interactive
